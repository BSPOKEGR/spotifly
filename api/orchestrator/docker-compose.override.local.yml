services:
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:spotifly-redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=admin
      - HTTP_PASSWORD=change-me
    ports:
      - "8098:8081"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - spotifly-net

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025" # MailHog SMTP
      - "8025:8025" # MailHog Web UI
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - spotifly-net

  backend:
    ports:
      - "9000:80"
    environment:
      APP_URL: ${API_VIRTUALHOST}
      VIRTUAL_HOST: ${API_VIRTUALHOST}
      VIRTUAL_PORT: 80
