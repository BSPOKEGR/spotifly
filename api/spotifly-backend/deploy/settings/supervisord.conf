[supervisord]
nodaemon=true

[program:horizon]
process_name=%(program_name)s
command=php artisan horizon
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=1300

; [program:pulse_work]
; process_name=%(program_name)s
; command=php artisan pulse:work
; autostart=true
; autorestart=true
; stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
; stderr_logfile_maxbytes=10MB
; stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
; stdout_logfile_maxbytes=10MB
; stopwaitsecs=100

; [program:pulse_check]
; process_name=%(program_name)s
; command=php artisan pulse:check
; autostart=true
; autorestart=true
; stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
; stderr_logfile_maxbytes=10MB
; stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
; stdout_logfile_maxbytes=10MB
; stopwaitsecs=100

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
process_name=%(program_name)s
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB

[program:fpm]
command=php-fpm -F
autostart=true
autorestart=true
process_name=%(program_name)s
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB
exitcodes=0
