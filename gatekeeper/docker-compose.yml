services:
  web:
    image: ghcr.io/openagri-eu/openagri-gatekeeper:latest
    container_name: django-gatekeeper
    restart: unless-stopped
    build: .
    env_file:
      - .env
    volumes:
      - .:/var/www
      - asset_volume:/var/www/assets
      - media_volume:/var/www/media
      - logs_volume:/var/www/logs
    ports:
      - "8001:8001"
    depends_on:
      - db
    networks:
      - openagri
      - gk_internal

  db:
    image: postgres:15
    container_name: gatekeeper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gk_internal

volumes:
  asset_volume:
  media_volume:
  logs_volume:
  pgdata:

networks:
  openagri:
    external: true
  gk_internal:
    driver: bridge